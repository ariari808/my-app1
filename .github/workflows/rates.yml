name: Update NBU rates

on:
  schedule:
    # 12:00 по Киеву: 09:00 UTC летом и 10:00 UTC зимой
    - cron: '5 9,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NBU rates
        run: |
          curl -fsSL "https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json" -o nbu.json
          python3 - <<'EOF'
          import json
          d = json.load(open('nbu.json'))
          want = ['USD', 'EUR', 'GBP', 'PLN']
          r = {x['cc']: x['rate'] for x in d if x['cc'] in want}
          assert len(r) == 4, 'missing currencies'
          date = next(x['exchangedate'] for x in d if x['cc'] == 'USD')
          json.dump({'date': date, 'rates': r}, open('rates.json', 'w'), ensure_ascii=False, indent=1)
          EOF
          rm nbu.json
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update NBU rates" && git push)
